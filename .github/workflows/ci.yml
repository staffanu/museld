name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (museld + ac3rf-efm-decode + python + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's own Vulkan packages are too old for the vulkan-hpp API museld
      # uses (vk::detail, typed debug callback); use the LunarG SDK instead.
      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list \
            "https://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            ninja-build pkg-config \
            libglfw3-dev libflac++-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev \
            catch2 python3-dev

      - name: Configure
        run: >
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          -S player -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS (museld + ac3rf-efm-decode + tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: >
          brew install ninja glfw vulkan-headers vulkan-loader molten-vk shaderc
          flac catch2 ffmpeg

      - name: Configure
        run: >
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          -DBUILD_PYTHON=OFF
          -S player -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows MSYS2 (ac3rf-efm-decode + tests)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p flac:p catch:p

      # BUILD_MUSE=OFF until museld is ported to Windows
      - name: Configure
        run: |
          git config --global --add safe.directory '*'
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON \
            -DBUILD_MUSE=OFF -DBUILD_PYTHON=OFF \
            -S player -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Builds the full Windows port and packages it for download. museld's Windows
  # runtime is still experimental, but the build has to keep working since the
  # published package comes from here.
  windows-package:
    name: Windows MSYS2 museld + package
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git zip
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p flac:p ffmpeg:p
            vulkan-headers:p vulkan-loader:p glfw:p shaderc:p

      # The default -march=native would target whatever CPU this runner happens
      # to have; x86-64-v3 (Haswell/Zen and later) is the baseline for the
      # published binaries and still enables the AVX filter paths.
      - name: Configure
        run: |
          git config --global --add safe.directory '*'
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMUSELD_ARCH=x86-64-v3 \
            -DBUILD_PYTHON=OFF \
            -S player -B build

      - name: Build
        run: cmake --build build

      # museld loads its SPIR-V shaders and the subtitle font from the directory
      # the executable lives in, so those have to travel with the binaries.
      - name: Stage package
        run: |
          set -euo pipefail
          pkg=museld-windows-x86_64
          mkdir -p "$pkg/shaders" "$pkg/fonts"
          cp build/src/museld.exe build/src/ac3rf-efm-decode.exe "$pkg/"
          cp build/src/shaders/*.spv "$pkg/shaders/"
          cp build/src/fonts/NotoSansJP-Regular.ttf "$pkg/fonts/"
          cp gpl-3.0.txt "$pkg/"
          cp packaging/windows/README.txt "$pkg/"

          # Bundle the UCRT64 DLLs the binaries need, transitively. Anything
          # resolving outside /ucrt64/bin is a Windows system DLL and is left
          # to the target machine.
          changed=1
          while [ "$changed" = 1 ]; do
            changed=0
            for f in "$pkg"/*.exe "$pkg"/*.dll; do
              [ -f "$f" ] || continue
              for dll in $(ldd "$f" | awk '/=> \/ucrt64\/bin\// {print $3}'); do
                if [ ! -f "$pkg/$(basename "$dll")" ]; then
                  cp "$dll" "$pkg/"
                  changed=1
                fi
              done
            done
          done

          # The Vulkan loader normally arrives with the graphics driver, so it is
          # not among the DLLs resolved above. Ship it too: it finds the driver
          # through the registry either way, and museld then starts far enough to
          # report a missing Vulkan device itself instead of failing to load.
          cp /ucrt64/bin/vulkan-1.dll "$pkg/"

          zip -qr "$pkg.zip" "$pkg"
          ls -la "$pkg"
          du -sh "$pkg.zip"

      # Run the packaged binaries with MSYS2 off the PATH: anything the package
      # fails to ship shows up here rather than on someone's machine. --help
      # returns before a Vulkan device is needed, so this works without a GPU.
      - name: Smoke test the package
        run: |
          set -euo pipefail
          cd museld-windows-x86_64
          # Only the binaries under test get the stripped PATH; the shell keeps
          # its own so grep and rm still work.
          clean_path="/c/Windows/System32:/c/Windows"
          PATH="$clean_path" ./ac3rf-efm-decode.exe --version
          # museld's --help exits non-zero, so check that it printed its usage;
          # a package missing a DLL never gets as far as printing anything.
          PATH="$clean_path" ./museld.exe --help > help.txt 2>&1 || true
          grep -q "^usage: museld" help.txt
          rm help.txt
          echo "packaged binaries start with only Windows system DLLs available"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: museld-windows-x86_64
          path: museld-windows-x86_64.zip

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: museld-windows-x86_64.zip
