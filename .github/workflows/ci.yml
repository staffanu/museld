name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (museld + ac3rf-efm-decode + python + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's own Vulkan packages are too old for the vulkan-hpp API museld
      # uses (vk::detail, typed debug callback); use the LunarG SDK instead.
      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list \
            "https://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            ninja-build pkg-config \
            libglfw3-dev libflac++-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev \
            catch2 python3-dev

      - name: Configure
        run: >
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          -S player -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS (museld + ac3rf-efm-decode + tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: >
          brew install ninja glfw vulkan-headers vulkan-loader molten-vk shaderc
          flac catch2 ffmpeg

      - name: Configure
        run: >
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          -DBUILD_PYTHON=OFF
          -S player -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows MSYS2 (ac3rf-efm-decode + tests)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p flac:p catch:p

      # BUILD_MUSE=OFF until museld is ported to Windows
      - name: Configure
        run: |
          git config --global --add safe.directory '*'
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON \
            -DBUILD_MUSE=OFF -DBUILD_PYTHON=OFF \
            -S player -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Builds the Windows port and packages it for download. museld's Windows
  # runtime is still experimental, but the build has to keep working since the
  # published packages come from here.
  #
  # Two builds: FFmpeg is over 90% of the bytes museld needs, so the video export
  # it provides gets its own download rather than being forced on everyone.
  windows-package:
    name: Windows MSYS2 museld + packages
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git zip
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p flac:p ffmpeg:p
            vulkan-headers:p vulkan-loader:p glfw:p shaderc:p

      # The default -march=native would target whatever CPU this runner happens
      # to have; x86-64-v3 (Haswell/Zen and later) is the baseline for the
      # published binaries and still enables the AVX filter paths.
      - name: Build without video export
        run: |
          git config --global --add safe.directory '*'
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMUSELD_ARCH=x86-64-v3 -DUSE_LIBAV=OFF \
            -DBUILD_PYTHON=OFF \
            -S player -B build-lean
          cmake --build build-lean

      - name: Build with video export
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMUSELD_ARCH=x86-64-v3 \
            -DBUILD_PYTHON=OFF \
            -S player -B build-full
          cmake --build build-full

      - name: Stage packages
        run: |
          set -euo pipefail
          stage=packaging/windows/stage-package.sh
          "$stage" build-lean museld-windows-x86_64 museld.exe ac3rf-efm-decode.exe
          "$stage" build-full museld-windows-x86_64-video-export museld.exe ac3rf-efm-decode.exe
          "$stage" build-lean ac3rf-efm-decode-windows-x86_64 ac3rf-efm-decode.exe

      - name: Smoke test the packages
        run: |
          set -euo pipefail
          for pkg in museld-windows-x86_64 museld-windows-x86_64-video-export \
                     ac3rf-efm-decode-windows-x86_64; do
            (packaging/windows/smoke-test.sh "$pkg")
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: "*.zip"
          if-no-files-found: error

      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
