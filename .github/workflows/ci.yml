name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (museld + ac3rf-efm-decode + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's own Vulkan packages are too old for the vulkan-hpp API museld
      # uses (vk::detail, typed debug callback); use the LunarG SDK instead.
      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list \
            "https://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            ninja-build pkg-config \
            libglfw3-dev libflac++-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev \
            catch2

      - name: Configure
        run: >
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          -S player -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build and test ldconv
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON \
            -S ldconv -B build-ldconv
          cmake --build build-ldconv
          ctest --test-dir build-ldconv --output-on-failure

  macos:
    name: macOS (museld + ac3rf-efm-decode + tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: >
          brew install ninja glfw vulkan-headers vulkan-loader molten-vk shaderc
          flac catch2 ffmpeg

      - name: Configure
        run: >
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          -S player -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build and test ldconv
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON \
            -S ldconv -B build-ldconv
          cmake --build build-ldconv
          ctest --test-dir build-ldconv --output-on-failure

  # Homebrew only has libraries for the architecture it is installed on, so each
  # architecture is built where it is native and the two are joined with lipo in
  # macos-package below.
  macos-build:
    name: macOS build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Nothing older than an M1 can run these, so the compiler default is
          # already the right baseline; on Intel pick one explicitly rather than
          # let -march=native target this runner's CPU.
          - arch: arm64
            runner: macos-latest
            march: ""
          - arch: x86_64
            runner: macos-15-intel
            march: "x86-64-v3"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: >-
          brew install ninja glfw vulkan-headers vulkan-loader molten-vk shaderc
          flac ffmpeg

      - name: Build without video export
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMUSELD_ARCH=${{ matrix.march }} -DUSE_LIBAV=OFF \
            -S player -B build-lean
          cmake --build build-lean

      - name: Build with video export
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMUSELD_ARCH=${{ matrix.march }} \
            -S player -B build-full
          cmake --build build-full

      - name: Stage packages
        run: |
          set -euo pipefail
          stage=packaging/macos/stage-package.sh
          out=stage/${{ matrix.arch }}
          mkdir -p "$out"
          "$stage" build-lean "$out/museld-macos" museld ac3rf-efm-decode
          "$stage" build-full "$out/museld-macos-video-export" museld ac3rf-efm-decode
          "$stage" build-lean "$out/ac3rf-efm-decode-macos" ac3rf-efm-decode

      - name: Check the staged packages
        run: |
          set -euo pipefail
          for pkg in stage/${{ matrix.arch }}/*/; do
            (packaging/macos/smoke-test.sh "$pkg")
          done

      # Through a tarball, because artifacts do not preserve the executable bit.
      - name: Pack the staged tree
        run: tar -czf macos-stage-${{ matrix.arch }}.tar.gz -C stage ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-stage-${{ matrix.arch }}
          path: macos-stage-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  macos-package:
    name: macOS universal packages
    needs: macos-build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-stage-*
          merge-multiple: true

      - name: Unpack both architectures
        run: |
          set -euo pipefail
          mkdir -p stage
          for t in macos-stage-*.tar.gz; do tar -xzf "$t" -C stage; done
          ls stage

      - name: Merge into universal packages
        run: |
          set -euo pipefail
          merge=packaging/macos/merge-universal.sh
          for name in museld-macos museld-macos-video-export ac3rf-efm-decode-macos; do
            case "$name" in
              museld-macos)                  out=museld-macos-universal ;;
              museld-macos-video-export)     out=museld-macos-universal-video-export ;;
              ac3rf-efm-decode-macos)        out=ac3rf-efm-decode-macos-universal ;;
            esac
            "$merge" "stage/arm64/$name" "stage/x86_64/$name" "$out"
            zip -qry "$out.zip" "$out"
          done

      - name: Smoke test the packages
        run: |
          set -euo pipefail
          for pkg in museld-macos-universal museld-macos-universal-video-export \
                     ac3rf-efm-decode-macos-universal; do
            (packaging/macos/smoke-test.sh "$pkg" --universal)
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: "*.zip"
          if-no-files-found: error

      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"

  windows:
    name: Windows MSYS2 (ac3rf-efm-decode + tests)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p flac:p catch:p

      # BUILD_MUSE=OFF until museld is ported to Windows.
      #
      # Built at the same baseline as the packages rather than the default
      # native, so the tests run against what is actually shipped. The AVX paths
      # are still covered: they are picked at runtime, and the runners have AVX.
      - name: Configure
        run: |
          git config --global --add safe.directory '*'
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON \
            -DMUSELD_ARCH=x86-64-v2 \
            -DBUILD_MUSE=OFF \
            -S player -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Also the only place ldconv's Windows-only file handling (_fseeki64,
      # binary mode on the standard streams) gets compiled at all.
      - name: Build and test ldconv
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON \
            -S ldconv -B build-ldconv
          cmake --build build-ldconv
          ctest --test-dir build-ldconv --output-on-failure

      # The packages are built at a baseline below AVX, so the AVX filter path is
      # reachable only through runtime detection -- and if that detection breaks,
      # everything still passes quietly on the scalar path (the parity tests skip
      # themselves when SIMD is unavailable). The runners have AVX, so --simd must
      # be accepted here: if this step fails, the packages are shipping scalar-only.
      - name: Check the AVX path is reachable at the package baseline
        run: |
          set -euo pipefail
          head -c 1048576 /dev/urandom > simd-check.s16
          ./build/src/ac3rf-efm-decode.exe --simd --sample-freq 40e6 --ac3 \
            --output-filename simd-check.ac3 simd-check.s16

  # Builds the Windows port and packages it for download. museld's Windows
  # runtime is still experimental, but the build has to keep working since the
  # published packages come from here.
  #
  # Two builds: FFmpeg is over 90% of the bytes museld needs, so the video export
  # it provides gets its own download rather than being forced on everyone.
  windows-package:
    name: Windows MSYS2 museld + packages
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git zip
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p flac:p ffmpeg:p
            vulkan-headers:p vulkan-loader:p glfw:p shaderc:p

      # The default -march=native would target whatever CPU this runner happens
      # to have; x86-64-v2 (Nehalem/Westmere and later) is the baseline for the
      # published binaries. This does not cost the AVX filter paths: those are
      # compiled in regardless of -march and selected at runtime, so the floor
      # here only decides which CPUs can run the binary at all.
      - name: Build without video export
        run: |
          git config --global --add safe.directory '*'
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMUSELD_ARCH=x86-64-v2 -DUSE_LIBAV=OFF \
            -S player -B build-lean
          cmake --build build-lean

      - name: Build with video export
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMUSELD_ARCH=x86-64-v2 \
            -S player -B build-full
          cmake --build build-full

      - name: Stage packages
        run: |
          set -euo pipefail
          stage=packaging/windows/stage-package.sh
          "$stage" build-lean museld-windows-x86_64 museld.exe ac3rf-efm-decode.exe
          "$stage" build-full museld-windows-x86_64-video-export museld.exe ac3rf-efm-decode.exe
          "$stage" build-lean ac3rf-efm-decode-windows-x86_64 ac3rf-efm-decode.exe

      - name: Smoke test the packages
        run: |
          set -euo pipefail
          for pkg in museld-windows-x86_64 museld-windows-x86_64-video-export \
                     ac3rf-efm-decode-windows-x86_64; do
            (packaging/windows/smoke-test.sh "$pkg")
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: "*.zip"
          if-no-files-found: error

      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
