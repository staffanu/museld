# Reference clips for tests/regression/regress.py.  The clips are short cuts of RF
# captures served from multivac (see docs/regression-testing.md); the goldens are
# in golden/<clip>.<stage>.json, with the full golden renders at golden_url.

base_url = "https://madeye.org/ld-captures/public/museld-testdata/"
golden_url = "https://madeye.org/ld-captures/public/museld-testdata/golden/"

# Frames before this many seconds are the decoder's warm-up (sync lock, AGC, the
# temporal comb's window, cadence lock, the MUSE equaliser) and are not judged.
judge_from = 2.0

# A stage is a set of museld options that isolates part of the decode; every clip is
# rendered once per stage of its standard (or its own `stages` list).
[stages]
default = []
intra-field = ["--field-interpolation", "intra-field"]
no-3d-comb = ["--no-3d-comb"]
no-film-mode = ["--no-film-mode"]
no-dropout = ["--no-dropout"]
eq-off = ["--eq", "off"]
all-audio = ["--write-audio", "analog,efm,ac3"]

[standard_stages]
ntsc = ["default", "intra-field", "no-3d-comb", "no-film-mode", "no-dropout"]
pal = ["default", "intra-field", "no-3d-comb", "no-dropout"]
muse = ["default", "intra-field", "eq-off"]

